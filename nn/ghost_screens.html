<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghost Gaming — All Screens</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<!--
 DESIGN SYSTEM — 3 separated layers on every screen:
  L0 BACKGROUND  .amb blobs (blurred, behind everything)
  L1 SURFACES    .surface cards: lighter than bg + hairline border + top highlight + deep shadow
  L2 CUTOUTS     .cut images: use TRANSPARENT PNGs; they float above cards (overflow allowed) with drop-shadow
 IMAGE SLOTS: fill src="" on any <img>. Empty src => placeholder shown.
 Data hooks: data-bind="..." (live data) / data-action="..." (tap).
-->
<style>
:root{--bg:#090915;--s1:#1a1a38;--s2:#101024;--line:rgba(255,255,255,.07);--p:#8b3ae8;--p2:#a855f7;--pk:#ff2d9b;--gr:#10b981;--am:#f59e0b;--rd:#ef4444;--tx:#fff;--mt:#9a9bb2;--bl:#a9d4ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#05050c;font-family:Inter,system-ui,sans-serif;color:var(--tx);padding:28px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;background:none;border:0;outline:0}
svg{display:block;flex:none} img:not([src]),img[src=""]{display:none}
.board{display:flex;gap:30px;overflow-x:auto;padding-bottom:20px}
figure{flex:none} figcaption{font-size:12px;color:var(--mt);margin:0 0 10px 6px;letter-spacing:.08em;text-transform:uppercase}
.phone{position:relative;width:393px;height:852px;border-radius:44px;overflow:hidden;background:var(--bg);border:1px solid #2a2a4a;box-shadow:0 30px 60px rgba(0,0,0,.6)}
/* L0 */
.amb{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
.a1{width:300px;height:300px;right:-90px;top:-60px;background:#6a2bd0;opacity:.55}
.a2{width:260px;height:260px;left:-110px;top:330px;background:#a3206f;opacity:.35}
.a3{width:240px;height:240px;right:-100px;bottom:80px;background:#3a2a9a;opacity:.3}
.scr{position:absolute;inset:0;z-index:1;overflow-y:auto;padding:22px 18px 92px;scrollbar-width:none}.scr::-webkit-scrollbar{display:none}
/* L1 */
.surface{background:linear-gradient(160deg,var(--s1),var(--s2));border:1px solid var(--line);border-radius:24px;box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 16px 28px -10px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.4)}
.surface.sel{border-color:rgba(168,85,247,.7);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 0 0 1px rgba(168,85,247,.35),0 12px 30px -6px rgba(139,58,232,.55)}
/* L2 */
.cut{position:relative}.cut img{position:absolute;filter:drop-shadow(0 10px 14px rgba(0,0,0,.65))}
.ph{background:radial-gradient(circle at 50% 40%,rgba(168,85,247,.25),transparent 70%),#0b0b1d}
/* common */
.top{display:flex;align-items:center;justify-content:space-between;height:46px;margin-bottom:16px}
.ib{width:42px;height:42px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.logo{font-family:Orbitron;font-weight:900;font-size:19px;letter-spacing:.08em;text-align:center;line-height:1;background:linear-gradient(180deg,#c6e8ff,#6f8dff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(110,140,255,.5))}
.logo small{display:block;font:600 9px Inter;letter-spacing:.38em;color:#8197cf;margin-top:3px;-webkit-text-fill-color:#8197cf}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em}.sub{font-size:13px;color:var(--mt);margin-top:4px}
.chips{display:flex;gap:8px;margin:14px 0;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;color:#b9b9d0;background:#13132a;border:1px solid var(--line)}
.chip.on{color:#fff;background:linear-gradient(90deg,#7a2fd6,#c026d3);border-color:transparent;box-shadow:0 6px 16px rgba(168,60,230,.45)}
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:16px;margin-top:14px}
.search input{flex:1;font-size:13px}.search input::placeholder{color:#6a6b88}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:16px;font-weight:700;font-size:14px;background:linear-gradient(90deg,#7a2fd6,#d12bd1);box-shadow:0 10px 24px -4px rgba(190,50,220,.55),0 1px 0 rgba(255,255,255,.25) inset}
.btn.ghost{background:linear-gradient(160deg,var(--s1),var(--s2));border:1px solid var(--line);box-shadow:0 10px 20px -8px #000}
.mt{color:var(--mt)}.pk{color:var(--pk)}
.nav{position:absolute;z-index:5;left:0;right:0;bottom:0;height:68px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(13,13,30,.96);border-top:1px solid #1d1d3a;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:#8c8ca8}
.nav a.on{color:var(--pk);font-weight:700}.nav a.on svg{filter:drop-shadow(0 0 6px rgba(255,45,155,.7))}
/* home */
.hero{position:relative;height:173px;border-radius:28px;background:#000;border:1.5px solid #2c1b5c;box-shadow:0 18px 34px -10px rgba(110,40,220,.55)}
.hero .bgart{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:radial-gradient(200px 150px at 80% 45%,rgba(130,50,255,.5),transparent 70%),#050509}
.hero .cut img{right:-4px;top:-26px;height:208px}
.hero .fade{position:absolute;inset:0;border-radius:28px;background:linear-gradient(90deg,#000 30%,transparent 65%)}
.hero .in{position:relative;z-index:2;padding:19px 20px 16px;height:100%;display:flex;flex-direction:column;align-items:flex-start}
.tag{padding:4px 12px;border-radius:999px;background:rgba(40,24,69,.9);border:1px solid rgba(140,90,230,.55);font-size:10px;font-weight:700;letter-spacing:.2em}
.hero h2{margin-top:12px;font-size:29px;line-height:1;font-weight:800}.hero h2 em{display:block;font-style:normal;color:var(--pk);text-shadow:0 0 18px rgba(255,45,155,.75)}
.pill{margin-top:auto;display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 10px;border-radius:999px;background:rgba(20,14,44,.95);border:1px solid rgba(150,90,240,.5);font-size:10.5px;font-weight:700;letter-spacing:.14em}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--pk);box-shadow:0 0 6px var(--pk)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.stat{display:flex;align-items:center;gap:9px;height:58px;padding:0 14px;border-radius:24px}
.dot{width:10px;height:10px;border-radius:50%}.stat strong{font-size:15px;font-weight:600;display:block}.stat small{font-size:12.5px;color:var(--mt)}
.feat{position:relative;height:195px;border-radius:28px;margin-top:20px;background:linear-gradient(135deg,#1a1230,#0c0c1c 55%,#3a1466);border:1.5px solid #2a1c52;box-shadow:0 18px 34px -10px rgba(0,0,0,.8)}
.feat .cut img{right:-6px;bottom:0;height:190px}.feat .in{position:relative;z-index:2;padding:20px 19px 16px;height:100%;display:flex;flex-direction:column}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.22em;color:var(--pk)}
.feat h3{font-size:20px;font-weight:700;margin-top:7px}.feat p{font-size:14px;color:#c9c9d8;margin-top:5px}
.pp{display:inline-flex;align-items:center;height:30px;padding:0 15px;border-radius:999px;background:linear-gradient(90deg,#7a2fd6,#8b3ae8);font-size:12.5px;font-weight:700;box-shadow:0 6px 16px rgba(140,60,230,.5)}
.arrow{width:36px;height:36px;border-radius:50%;background:#0d1124;border:1px solid #232b4c;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px #000}
.pager{display:flex;justify-content:center;margin:13px 0 4px}.pager i{width:24px;height:6px;border-radius:3px;background:var(--pk);box-shadow:0 0 8px rgba(255,45,155,.6)}
.sh{display:flex;justify-content:space-between;align-items:center;margin:18px 0 14px}.sh b{font-size:16px;font-weight:600}.sh a{font-size:13px;font-weight:600;color:var(--pk)}
.qa{height:128px;padding:16px 17px;border-radius:26px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:linear-gradient(180deg,#171832,#1a1738 55%,#3a1b5e);border:1.5px solid rgba(160,60,200,.38)}
.qa b{font-size:15px;font-weight:600;display:block}.qa small{font-size:12px;color:var(--mt)}
/* signup */
.field{display:flex;align-items:center;gap:11px;height:50px;padding:0 14px;border-radius:16px;margin-bottom:11px}
.field input{flex:1;font-size:13px}.field input::placeholder{color:#767894}
.chk{display:flex;gap:10px;font-size:12px;color:var(--mt);margin:6px 0 16px;line-height:1.5}.chk i{flex:none;width:18px;height:18px;border-radius:6px;background:linear-gradient(135deg,#7a2fd6,#d12bd1);margin-top:1px}.chk b{color:var(--pk);font-weight:600}
.or{display:flex;align-items:center;gap:12px;color:var(--mt);font-size:12px;margin:14px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
/* games */
.games{display:grid;grid-template-columns:1fr 1fr;gap:14px 13px;margin-top:6px}
.gc{height:200px;padding:12px;border-radius:22px;display:flex;flex-direction:column;position:relative}
.gc .cut{flex:1;border-radius:16px;overflow:visible}.gc .cut img{left:50%;transform:translateX(-50%);bottom:0;height:118%;max-width:none}
.gc b{font-size:13.5px;font-weight:700;margin-top:10px}.gc small{font-size:11.5px;color:var(--mt)}
.plat{position:absolute;top:12px;left:12px;z-index:3;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;background:rgba(10,10,25,.85);border:1px solid rgba(168,85,247,.5);color:#d9c2ff}
/* booking */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:12px 0 22px}
.day{height:70px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.day small{font-size:11px;color:var(--mt)}.day b{font-size:18px}
.times{display:flex;gap:9px;margin:12px 0 22px;flex-wrap:wrap}.time{padding:11px 17px;border-radius:14px;font-size:13px;font-weight:600}
.st{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;margin-bottom:12px}
.st .cut{width:58px;height:58px;border-radius:16px}.st b{font-size:14.5px;display:block}.st small{font-size:12px;color:var(--mt)}
.radio{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid #3a3a5e}.sel .radio{border-color:var(--p2);background:radial-gradient(circle,var(--p2) 45%,transparent 50%)}
/* inventory */
.it{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:20px;margin-bottom:12px}
.it .cut{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff9}.it .cut img{inset:-8px;width:72px;height:72px;object-fit:contain}
.it b{font-size:14.5px;display:block}.it small{font-size:12px;color:var(--mt)}
.bd{margin-left:auto;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700}
.ok{color:#34d399;background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.4)}.md{color:#fbbf24;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.4)}.lo{color:#f87171;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.4)}
/* reports */
.kpi{padding:14px;border-radius:22px;min-height:118px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:11.5px;color:var(--mt);display:flex;justify-content:space-between;align-items:center}.kpi .v{font-size:21px;font-weight:800;letter-spacing:-.02em}.kpi .v small{font-size:12px;font-weight:600;color:var(--mt)}.kpi .f{font-size:11.5px;color:var(--mt);margin-top:auto}
.up{font-size:10.5px;font-weight:700;color:#34d399;background:rgba(16,185,129,.15);padding:2px 7px;border-radius:999px}
.bar{height:6px;border-radius:3px;background:#1d1d3c;overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#7a2fd6,#ff2d9b)}
.card{padding:16px;border-radius:24px;margin-top:14px}.card h5{font-size:14.5px;font-weight:700}.card .sub{font-size:11.5px;margin:2px 0 12px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:#1b1b3d;border:1px solid var(--line)}
.row b{font-size:13.5px;display:block}.row small{font-size:11.5px;color:var(--mt)}.row .r{margin-left:auto;text-align:right;font-size:13.5px;font-weight:700}
.seg{display:flex;padding:4px;border-radius:14px;gap:4px;margin-top:14px}.seg span{flex:1;text-align:center;padding:8px 0;font-size:11.5px;font-weight:600;color:var(--mt);border-radius:10px}.seg .on{color:#fff;background:linear-gradient(90deg,#7a2fd6,#c026d3);box-shadow:0 4px 12px rgba(168,60,230,.5)}

/* admin */
.prof{display:flex;align-items:center;gap:14px;padding:16px;border-radius:26px;margin-top:6px}
.av{position:relative;width:62px;height:62px;border-radius:20px;background:linear-gradient(135deg,#7a2fd6,#ff2d9b);display:flex;align-items:center;justify-content:center;font:900 22px Orbitron;box-shadow:0 10px 22px -4px rgba(190,50,220,.6)}
.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:20px;object-fit:cover}
.prof b{font-size:17px;display:block}.prof small{font-size:12px;color:var(--mt);display:block;margin-top:2px}
.role{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.14em;color:#ffd1ec;background:rgba(255,45,155,.15);border:1px solid rgba(255,45,155,.45)}
.mini{padding:12px;border-radius:20px;text-align:center}.mini b{display:block;font-size:19px;font-weight:800}.mini small{font-size:10.5px;color:var(--mt)}
.grp{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--mt);margin:22px 0 10px 4px}
.menu{border-radius:24px;padding:6px 14px}
.mi{display:flex;align-items:center;gap:13px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}.mi:first-child{border-top:0}
.mi .t{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 14px -4px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.25) inset}
.mi b{display:block;font-size:14px;font-weight:600}.mi small{font-size:11.5px;color:var(--mt)}
.mi .ch{margin-left:auto;color:#6a6b88;display:flex;align-items:center;gap:8px}
.cnt{color:#fff;min-width:22px;height:22px;padding:0 6px;border-radius:999px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--pk);box-shadow:0 0 10px rgba(255,45,155,.6)}
.out{color:#f87171;border-color:rgba(239,68,68,.35)}

/* splash + login */
.splash{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring{position:absolute;left:50%;top:41%;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(168,85,247,.22)}
.psi{position:absolute;font:800 34px Inter;opacity:.5;filter:drop-shadow(0 0 8px currentColor)}
.mark{position:relative;width:104px;height:104px;border-radius:32px;display:flex;align-items:center;justify-content:center;margin-bottom:26px;box-shadow:0 0 0 1px rgba(168,85,247,.35),0 24px 50px -8px rgba(139,58,232,.75),0 0 60px rgba(255,45,155,.25)}
.mark img{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6))}
.big{font:900 40px Orbitron;letter-spacing:.08em;line-height:1;background:linear-gradient(180deg,#c6e8ff,#6f8dff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(110,140,255,.55))}
.big small{display:block;font:600 13px Inter;letter-spacing:.55em;color:#8197cf;margin-top:10px;-webkit-text-fill-color:#8197cf;padding-left:.55em}
.tagl{margin-top:22px;font-size:13px;color:var(--mt);letter-spacing:.04em}.tagl b{color:var(--pk);font-weight:700}
.load{position:absolute;left:60px;right:60px;bottom:96px;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--mt)}
.load .bar{height:5px;margin-bottom:14px}.load .bar i{width:62%;box-shadow:0 0 10px rgba(255,45,155,.7)}
.ver{position:absolute;bottom:42px;left:0;right:0;text-align:center;font-size:11px;color:#5d5e7c}
.lhero{position:relative;height:190px;margin:-22px -18px 8px}
.lhero .a{position:absolute;inset:0;background:radial-gradient(240px 150px at 50% 35%,rgba(140,60,255,.5),transparent 70%)}
.lhero .cut img{left:50%;transform:translateX(-50%);top:14px;height:176px}
.lhero .logo{position:absolute;top:24px;left:0;right:0;z-index:2}
.forgot{display:block;text-align:right;font-size:12px;font-weight:600;color:var(--pk);margin:2px 2px 18px}
.eye{margin-left:auto;color:#8b8cab}
</style></head>
<body>
<div class="board">

<!-- ============ 0a. SPLASH ============ -->
<figure><figcaption>0 &middot; Splash (D&eacute;marrage)</figcaption><div class="phone"><i class="amb a1" style="width:360px;height:360px;top:-80px"></i><i class="amb a2" style="top:380px"></i><i class="amb a3" style="bottom:-40px"></i>
 <div class="ring" style="width:260px;height:260px"></div><div class="ring" style="width:380px;height:380px;border-color:rgba(255,45,155,.14)"></div><div class="ring" style="width:520px;height:520px;border-color:rgba(168,85,247,.1)"></div>
 <span class="psi" style="left:46px;top:96px;color:#4b75ff">&#10005;</span><span class="psi" style="right:52px;top:150px;color:#ff2d9b">&#9675;</span><span class="psi" style="left:62px;top:560px;color:#10b981">&#9651;</span><span class="psi" style="right:60px;top:610px;color:#a855f7">&#9633;</span>
 <div class="splash" style="padding-bottom:60px">
  <div class="mark surface" style="border-radius:32px"><span data-i="game" data-s="54" style="filter:drop-shadow(0 0 10px rgba(120,190,255,.8))"></span><img id="slot-splash" src="" alt=""></div>
  <div class="big">GHOST<small>GAMING</small></div>

 </div>
 <div class="load"><div class="bar"><i></i></div>CHARGEMENT...</div>
 <div class="ver">v1.0.0</div></div></figure>

<!-- ============ 0b. LOGIN ============ -->
<figure><figcaption>0 &middot; Connexion</figcaption><div class="phone"><i class="amb a1"></i><i class="amb a2"></i>
<div class="scr">
 <div class="lhero"><div class="a"></div><div class="logo">GHOST<small>GAMING</small></div><div class="cut"><img id="slot-login" src="" alt=""></div></div>
 <h1>Connexion</h1><p class="sub" style="margin-bottom:22px">Bon retour ! Connectez-vous &agrave; votre compte</p>
 <div class="surface field" data-i="mail"><input type="text" placeholder="Email ou num&eacute;ro de t&eacute;l&eacute;phone"></div>
 <div class="surface field" data-i="lock"><input type="password" placeholder="Mot de passe"><button class="eye" data-i="eye" data-action="toggle_pwd"></button></div>
 <a class="forgot" data-action="forgot">Mot de passe oubli&eacute; ?</a>
 <button class="btn" data-action="login">Se connecter</button>
 <div class="or">ou</div>
 <button class="btn ghost" data-action="google"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.6a4.8 4.8 0 0 1-2.1 3.1v2.6h3.4c2-1.8 3.1-4.5 3.1-7.5z"/><path fill="#34A853" d="M12 22c2.8 0 5.2-.9 6.9-2.5l-3.4-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.700v2.700A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.200 13.600a6 6 0 0 1 0-3.800V7.100H2.700a10 10 0 0 0 0 9.200z"/><path fill="#EA4335" d="M12 6c1.500 0 2.900.5 4 1.600l3-3A10 10 0 0 0 2.700 7.100l3.500 2.700C7 7.800 9.300 6 12 6z"/></svg>Continuer avec Google</button>
 <button class="btn ghost" style="margin-top:12px" data-action="scan_qr"><span data-i="qr" data-s="18"></span>Scanner le QR du poste (Client)</button>
 <p class="sub" style="text-align:center;margin-top:20px">Pas encore de compte ? <b class="pk">Cr&eacute;er mon compte</b></p>
</div></div></figure>

<!-- ============ 1. SIGNUP ============ -->
